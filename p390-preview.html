<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>390px preview — Jinart Beauty EN page</title>
<style>
  html,body{margin:0;background:#24231f;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
  .wrap{display:flex;gap:22px;align-items:flex-start;padding:20px}
  .device{width:390px;flex:none;background:#fff;box-shadow:0 12px 44px rgba(0,0,0,.55);overflow:hidden}
  iframe{width:390px;height:2400px;border:0;display:block}
  .meta{color:#a9a396;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding-top:8px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="device"><iframe id="f" src="en/" title="390px preview"></iframe></div>
    <div class="meta" id="m">390 × 2400</div>
  </div>
<script>
  var q = new URLSearchParams(location.search);
  var f = document.getElementById('f');
  var qs = [];
  if (q.get('lang')) qs.push('lang=' + encodeURIComponent(q.get('lang')));
  if (q.get('v')) qs.push('v=' + encodeURIComponent(q.get('v')));
  if (qs.length) f.src = 'en/?' + qs.join('&');
  if (q.get('h')) f.style.height = q.get('h') + 'px';
</script>
</body>
</html>
